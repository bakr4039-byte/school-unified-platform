<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنصة المدرسية المتكاملة</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#17263e}header{background:#12345b;color:white;padding:24px}main{max-width:1100px;margin:auto;padding:24px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button{border:0;border-radius:10px;background:#e3eaf4;padding:12px;cursor:pointer}button.active{background:#1264a3;color:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:white;padding:22px;border-radius:15px;box-shadow:0 2px 10px #0001}small{color:#64748b}.note{background:#fff4d6;padding:14px;border-radius:10px}</style></head><body><header><h1>المنصة المدرسية المتكاملة</h1><p>نسخة عرض تأسيسية مستقلة — بيانات توضيحية فقط</p></header><main><p class="note">هذه واجهة تجريبية، وليست نظامًا جاهزًا لحفظ بيانات الطلاب أو المعلمين. لا تدخل بيانات حقيقية.</p><nav id="nav"></nav><section id="content"></section></main><script>const modules=[["لوحة القيادة","مؤشرات الجاهزية والمتابعة"],["التقويم الذاتي","المجالات والمعايير والمؤشرات"],["الشواهد والسجلات","الأدلة المقترحة والملفات المرتبطة والمراجعة"],["المعلمون","ملفات الإنجاز والتطوير المهني"],["الطلاب","الحضور والغياب والسلوك"],["الشؤون التعليمية","الحصص والجداول والزيارات"],["الجودة والتطوير","خطط التحسين والمبادرات"],["المساعد الذكي","تحليل الشواهد والتوصيات (قيد التطوير)"],["مركز التقارير","التقارير والطباعة والتصدير (قيد التطوير)"]];function show(i){document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('active',i===j));let m=modules[i];document.getElementById('content').innerHTML='<h2>'+m[0]+'</h2><div class="cards"><article class="card"><h3>'+m[1]+'</h3><small>وحدة قيد التطوير — لا توجد بيانات حقيقية</small></article><article class="card"><h3>حالة التنفيذ</h3><p>الواجهة التأسيسية متاحة للمعاينة</p></article></div>'}modules.forEach((m,i)=>{let b=document.createElement('button');b.textContent=m[0];b.onclick=()=>show(i);document.getElementById('nav').append(b)});show(0)</script></body></html>
